; FluidNinja Buoyancy: the quality tiers of sg.WaterQuality (Docs/UserGuide.md, Quality).
;
; Each section sets the plugin's scalability cvars for one tier; the plugin applies the section of the tier in use once the engine's own
; scalability is in, and again whenever sg.WaterQuality (or, while it follows it, sg.EffectsQuality) changes.
;
; Epic ([WaterQuality@3]) is the calibrated defaults: the project settings as they are, every cap 0 (the setting) and every scale 1,
; with waves on the 4 nearest simulations and own fields within 60 m. It is the tier a project gets without asking, because
; sg.WaterQuality is -1 by default (follow sg.EffectsQuality) and a desktop project runs the engine's effects quality 3 (Epic). High,
; Medium and Low cap or scale the project settings for less cost, so a team's tuned values survive a tier change; Cinematic is the
; premium tier above the defaults (a double-size mirror, every body an own field, the distances pushed out). A project overrides a key
; in its own Config/DefaultFluidNinjaBuoyancy.ini (layered on this file), or under the same section in Config/DefaultScalability.ini,
; which is applied last. Overrides written when High held the defaults belong under [WaterQuality@3] now.
;
; Comments stay on lines of their own: the engine's ini reader takes everything after a key's '=' as its value.
;
; The fnb.Waves cvars (the wave grid's fnb.Waves.ScaleDown and fnb.Waves.MaxActiveSims, the self fields' distance, the foam switch) belong to FluidNinja
; Waves (FluidNinjaBuoyancyWaves.cpp); every cvar must be flagged ECVF_Scalability to take a value from here.

[WaterQuality@0]
; Low: floats and drifts on a quarter-size mirror redrawn every third frame, far bodies on coarse hulls gathered rarely, a quarter of the
; wave grid, one wave simulation, few effects.
fnb.Capture.Scale=0.25
fnb.Capture.EveryNFrames=3
fnb.Gather.MaxGrid=32
fnb.Gather.BudgetPerFrame=16
fnb.Gather.FarEveryNFrames=4
fnb.Lod.Bias=2
fnb.Lod.DistanceScale=0.5
fnb.Lod.SleepDistanceScale=0.5
fnb.Wake.MaxPoints=64
fnb.Waves.MaxImpulses=1024
fnb.Waves.ScaleDown=4
fnb.Waves.MaxActiveSims=1
fnb.Waves.SelfFieldDistanceCm=1500
; The hull raster's lines per cell, capping Wave Raster Lines (32): 8 steps a hull edge across a cell in eighths (about 2.5 cm on a
; RIB's tubes), a quarter of Epic's raster lines.
fnb.Waves.MaxRasterLines=8
fnb.Waves.Foam=0
fnb.Effects.SplashBudgetPerFrame=2
fnb.Effects.ReachScale=0.5
fnb.Effects.Crown=0
fnb.Effects.WetLine=0
; The spray sheets (bodies with Spray Sheets on): whether they run, and how many drops (fnb.Effects.SpraySheets, fnb.Effects.SprayRateScale).
fnb.Effects.SpraySheets=0
fnb.Effects.SprayRateScale=0.5

[WaterQuality@1]
; Medium: a half-size mirror every other frame, half the wave grid, two simulations, own fields only near the camera.
fnb.Capture.Scale=0.5
fnb.Capture.EveryNFrames=2
fnb.Gather.MaxGrid=64
fnb.Gather.BudgetPerFrame=64
fnb.Gather.FarEveryNFrames=3
fnb.Lod.Bias=1
fnb.Lod.DistanceScale=0.75
fnb.Lod.SleepDistanceScale=0.75
fnb.Wake.MaxPoints=128
fnb.Waves.MaxImpulses=4096
fnb.Waves.ScaleDown=2
fnb.Waves.MaxActiveSims=2
fnb.Waves.SelfFieldDistanceCm=3000
; The hull raster's lines per cell, capping Wave Raster Lines (32): 8, as Low.
fnb.Waves.MaxRasterLines=8
fnb.Waves.Foam=1
fnb.Effects.SplashBudgetPerFrame=4
fnb.Effects.ReachScale=0.75
fnb.Effects.Crown=0
fnb.Effects.WetLine=1
; The spray sheets (bodies with Spray Sheets on): whether they run, and how many drops (fnb.Effects.SpraySheets, fnb.Effects.SprayRateScale).
fnb.Effects.SpraySheets=0
fnb.Effects.SprayRateScale=0.75

[WaterQuality@2]
; High: Epic's water on a three-quarter mirror, with the far and crowded work trimmed. Every body keeps the hull Epic gives it, so the
; hull's forces are Epic's; a body reads its water on the coarser mirror, and from 45 m a body makes waves but feels none.
; A 768-texel mirror (10.4 cm over the default 80 m instead of 7.8 cm). The gather's points are one texel apart, so a body takes
; 0.75^2 = 0.56 of Epic's points (a crate about 1,300 for 2,200) and the capture draws 0.56 of the pixels.
fnb.Capture.Scale=0.75
; Redrawn every frame: a held mirror hands the gather the same heights under a new time, so the water's rate, and the acceleration
; a_w the added mass takes from successive patches, would come in steps.
fnb.Capture.EveryNFrames=1
; 0.75 of the setting's 128, so the grid's cap scales with the mirror: a body too big for the grid (about 10 m of water across, as at
; Epic) is sampled 1 / 0.75 as coarsely as there, like every smaller body, instead of keeping Epic's full 128 x 128 points.
fnb.Gather.MaxGrid=96
; Binds only when more than 128 bodies are due in one frame (half of Max Gather Bodies' 256): it bounds that frame's gather pass and
; readback, and the bodies left over keep their last patch, never past Max Extrapolation Seconds (0.08 s).
fnb.Gather.BudgetPerFrame=128
; Epic's cadence. 3 would gather the mid band a third less often at 60 fps, but an urgent gather (Max Extrapolation Seconds, 0.08 s)
; does not move a body's turn (GatherFootprints). At 30 fps the mid band would then be gathered at gaps of 2 and 1 frames, and at
; 60 fps the far band at gaps of 4 and 2, each a third more often than at Epic.
fnb.Gather.FarEveryNFrames=2
; No bias and no distance scale: the coarse hulls do not yet float as the fine one does, and the distance scale would coarsen the
; gather's spacing and cadence as well as the hulls.
fnb.Lod.Bias=0
fnb.Lod.DistanceScale=1
; Sleep from 51 m instead of 60 m. Only a body that is far, unseen for half a second and still goes to sleep, so nothing visible changes.
fnb.Lod.SleepDistanceScale=0.85
; Crowd caps at three quarters and half of the settings' 256 and 32768. Wake points are taken first come until the cap; past the
; impulse cap a body's neighbouring pieces are merged, keeping the frame's whole impulse and where it lands.
fnb.Wake.MaxPoints=192
fnb.Waves.MaxImpulses=16384
; The full wave grid: a scale-down drops the short waves the bodies feel and starts every simulation's waves afresh, which is Medium's
; trade.
fnb.Waves.ScaleDown=1
; One simulation fewer than Epic runs waves: the farthest of four (distance over Importance) goes quiet.
fnb.Waves.MaxActiveSims=3
; The hull raster's lines per cell, capping Wave Raster Lines (32): 16, half Epic's raster lines; a hull edge steps across a cell in
; sixteenths (about 1.3 cm on a RIB's tubes).
fnb.Waves.MaxRasterLines=16
; Own fields within 45 m instead of 60 m. Their cost goes with the sum of their cells squared, so the far bodies are most of it; the
; bodies beyond make waves and feel none.
fnb.Waves.SelfFieldDistanceCm=4500
fnb.Waves.Foam=1
; Six splashes a frame instead of eight, drawn to 0.85 of the Lod Distances (the whole budget within 25.5 m, none past 68 m, where a
; splash is a few pixels); crowns and the wet line as at Epic.
fnb.Effects.SplashBudgetPerFrame=6
fnb.Effects.ReachScale=0.85
fnb.Effects.Crown=1
fnb.Effects.WetLine=1
; The spray sheets (bodies with Spray Sheets on): whether they run, and how many drops (fnb.Effects.SpraySheets, fnb.Effects.SprayRateScale).
fnb.Effects.SpraySheets=1
fnb.Effects.SprayRateScale=0.75

[WaterQuality@3]
; Epic, the default: the calibrated defaults, the project settings as they are (every cap 0, every scale 1, waves on the 4 nearest
; simulations, own fields within 60 m). sg.WaterQuality follows sg.EffectsQuality, which a desktop project runs at 3, so a project
; that sets nothing runs this.
fnb.Capture.Scale=1
fnb.Capture.EveryNFrames=1
fnb.Gather.MaxGrid=0
fnb.Gather.BudgetPerFrame=0
fnb.Gather.FarEveryNFrames=2
fnb.Lod.Bias=0
fnb.Lod.DistanceScale=1
fnb.Lod.SleepDistanceScale=1
fnb.Wake.MaxPoints=0
fnb.Waves.MaxImpulses=0
fnb.Waves.ScaleDown=1
fnb.Waves.MaxActiveSims=4
fnb.Waves.SelfFieldDistanceCm=6000
fnb.Waves.MaxRasterLines=0
fnb.Waves.Foam=1
fnb.Effects.SplashBudgetPerFrame=8
fnb.Effects.ReachScale=1
fnb.Effects.Crown=1
fnb.Effects.WetLine=1
; The spray sheets (bodies with Spray Sheets on): whether they run, and how many drops (fnb.Effects.SpraySheets, fnb.Effects.SprayRateScale).
fnb.Effects.SpraySheets=1
fnb.Effects.SprayRateScale=1

[WaterQuality@Cine]
; Cinematic, the premium tier: a double-size mirror (2048 texels, 3.9 cm over the default 80 m, so about four times Epic's gather
; points: 8,800 measured on a crate), every simulation runs waves, every body has an own field, hull, sleep and effect distances half
; as far again, sixteen splashes a frame. It was a 4x mirror before; that is gone, because the grid's 128-point cap held a crate to
; about 1.9 times this tier's points for four times its mirror pixels and memory (the R32F mirror alone 64 MB against 16 MB), and its
; every-frame far gathers, tripled distances and unlimited splashes were costs without a bound.
fnb.Capture.Scale=2
fnb.Capture.EveryNFrames=1
fnb.Gather.MaxGrid=0
fnb.Gather.BudgetPerFrame=0
fnb.Gather.FarEveryNFrames=2
fnb.Lod.Bias=0
fnb.Lod.DistanceScale=1.5
fnb.Lod.SleepDistanceScale=1.5
fnb.Wake.MaxPoints=0
fnb.Waves.MaxImpulses=0
fnb.Waves.ScaleDown=1
fnb.Waves.MaxActiveSims=0
fnb.Waves.SelfFieldDistanceCm=0
fnb.Waves.MaxRasterLines=0
fnb.Waves.Foam=1
fnb.Effects.SplashBudgetPerFrame=16
fnb.Effects.ReachScale=1.5
fnb.Effects.Crown=1
fnb.Effects.WetLine=1
; The spray sheets (bodies with Spray Sheets on): whether they run, and how many drops (fnb.Effects.SpraySheets, fnb.Effects.SprayRateScale).
fnb.Effects.SpraySheets=1
fnb.Effects.SprayRateScale=1.5
